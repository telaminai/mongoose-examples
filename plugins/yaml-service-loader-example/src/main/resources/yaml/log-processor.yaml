# Event-processor topology loaded by svc-loader-yaml at server boot.
# `namedNodes` maps a node id to its instance; the `!!` tag picks the class
# to instantiate and following properties are bean-set on it.
namedNodes:
  logHandler: !!com.telamin.mongoose.example.yaml.loader.YamlLogHandler
    prefix: "YAML-LOADED-HANDLER:"
enableAudit: true
