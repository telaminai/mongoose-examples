# java.util.logging configuration loaded via -Djava.util.logging.config.file
# Global default logging level
.level = INFO

# Configure console handler — must be set to FINE (or lower) for any logger
# above it to actually emit FINE-level records to the console.
handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Surface the wrapped cause of an InvocationTargetException coming back from
# the event processor. EventQueueToEventProcessorAgent only logs the warning
# message; DefaultErrorReporter logs the throwable with the full chained
# stack (including "Caused by:" frames).
com.telamin.mongoose.service.error.DefaultErrorReporter.level = FINE

# Show retry / drop decisions from the dispatch loop.
com.telamin.mongoose.dutycycle.level = FINE

# Example: override a specific logger to INFO (commented)
# com.telamin.mongoose.level = INFO
